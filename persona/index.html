<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페르소나 서랍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<meta name="theme-color" content="#ffffff">

<style>
/* Layout: shared "스크랩" app bar (logo · 발췌|페르소나 switch · 화면 설정) → persona index header with stats → search + segmented sort → tag chips → 4-col (PC) / 2-col (phone) index cards; detail is a two-column spec sheet (PC) or full-screen sheet (phone). Palette, type and dark mode follow the 발췌 site (zinc neutrals, Noto Sans KR, html.ui-dark + the shared 'excerpt-ui' setting). */
:root{
  --bg:#f7f7f8; --paper:#fafafa; --surface:#ffffff; --ink:#18181b; --muted:#71717a;
  --rule:#e2e2e5; --dash:#ececee; --soft:#f4f4f5; --accent:#18181b; --on-accent:#ffffff;
  --chip-bg:#f4f4f5; --chip-fg:#3f3f46; --code-bg:#18181b; --code-fg:#f4f4f5;
  --danger:#dc2626; --scrim:rgba(0,0,0,.45); --ph-l:72%; --ph-d:52%;
  --f-body:"Noto Sans KR","Pretendard",system-ui,sans-serif;
  --f-mono:"Noto Sans KR","Pretendard",system-ui,sans-serif; /* 글씨체는 하나로: 굵기·크기로만 구분 */
  color-scheme:light;
}
html.ui-dark{
  --bg:#0f1012; --paper:#141518; --surface:#18191c; --ink:#ececf1; --muted:#a3a3ad;
  --rule:#35363d; --dash:#26272c; --soft:#232428; --accent:#ececf1; --on-accent:#111111;
  --chip-bg:#232428; --chip-fg:#d4d4d8; --code-bg:#0b0c0e; --code-fg:#d4d4d8;
  --danger:#f87171; --scrim:rgba(0,0,0,.6); --ph-l:46%; --ph-d:26%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
a{color:var(--accent)}
.mono{font-family:var(--f-mono)}

/* header */
.strip{height:140px;overflow:hidden;border-bottom:1px solid var(--rule)}
.strip img{width:100%;height:100%;object-fit:cover}
.head{background:var(--paper);border-bottom:1px solid var(--rule)}
.head-in{max-width:1360px;margin:0 auto;padding:28px 40px 22px;display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-end}
.who{display:flex;gap:16px;align-items:flex-end;flex:1 1 420px;min-width:0}
.av{width:64px;height:64px;flex:none;border:1px solid var(--rule);overflow:hidden;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:24px}
.av img{width:100%;height:100%;object-fit:cover}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
.who h1{margin:2px 0 4px;font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.who .desc{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.stats{display:flex;gap:28px;font-family:var(--f-mono);align-items:flex-end}
.stat{display:flex;flex-direction:column}
.stat span{font-size:11px;color:var(--muted)}
.stat b{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.gear{width:44px;height:44px;border:1px solid var(--rule);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.gear:hover{background:var(--bg)}

/* toolbar */
.wrap{max-width:1360px;margin:0 auto;padding:24px 40px 72px;display:flex;flex-direction:column;gap:18px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 300px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--rule);padding:0 14px;height:44px}
.search input{border:0;background:none;outline:none;width:100%;font-size:15px}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;border:1px solid var(--rule);height:44px;font-family:var(--f-mono);font-size:13px;background:var(--surface)}
.seg button{border:0;border-left:1px solid var(--rule);background:none;padding:0 15px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.add-btn{height:44px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:0 20px;font-weight:600}
.add-btn:hover{filter:brightness(1.07)}
.tagbar{display:flex;border:1px solid var(--rule);background:var(--surface);width:fit-content;max-width:100%;overflow-x:auto;font-family:var(--f-mono);font-size:13px;scrollbar-width:thin}
.tagbtn{border:0;border-left:1px solid var(--rule);background:none;padding:9px 16px;white-space:nowrap;flex:none}
.tagbtn:first-child{border-left:0}
.tagbtn .n{color:var(--muted);margin-left:4px}
.tagbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tagbtn[aria-pressed="true"] .n{color:inherit;opacity:.8}

/* grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid.compact{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,box-shadow .12s;min-width:0}
.card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--rule)}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--rule);font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.dday{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.thumb{margin:12px;position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--paper)}
.thumb img{width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px;font-family:var(--f-mono);font-size:11px;color:rgba(255,255,255,.85)}
.ph b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-body);font-size:44px;color:rgba(255,255,255,.88)}
.ex{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--ink);border:1px solid var(--rule);font-family:var(--f-mono);font-size:11px;padding:0 6px}
.info{padding:0 14px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.nm h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.nm span{font-size:13px;color:var(--muted)}
.hash{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-top:3px}
.chip{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;padding:1px 7px;line-height:1.5}
.grid.compact .thumb{margin:8px}
.grid.compact .info{padding:0 10px 10px}
.grid.compact .nm h2{font-size:15px}
.grid.compact .nm span,.grid.compact .hash,.grid.compact .chips{display:none}
#notes{display:flex;flex-direction:column;gap:8px}
#notes:empty{display:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;border:1px dashed var(--dash)}
.note{background:var(--surface);border:1px solid var(--rule);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note .add-btn{height:32px;padding:0 12px;font-size:12.5px}

/* detail modal */
.overlay{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--rule);width:min(1180px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column}
.modal.narrow{width:min(680px,100%)}
.mtop{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--rule);background:var(--surface);font-family:var(--f-mono);font-size:13px}
.mtop .acts{display:flex;gap:8px}
.mbtn{border:1px solid var(--rule);background:var(--surface);padding:6px 14px;font-family:var(--f-mono);font-size:12.5px;min-height:34px}
.mbtn:hover{background:var(--bg)}
.mbtn.x{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:6px 12px}
.sheet{display:flex;flex-wrap:wrap}
.side{flex:1 1 360px;padding:24px;border-right:1px solid var(--rule);background:var(--paper);display:flex;flex-direction:column;gap:12px}
.side .cover{aspect-ratio:3/4;position:relative;overflow:hidden;background:var(--bg)}
.side .cover img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.spec{flex:999 1 560px;min-width:0;padding:26px 32px 32px;display:flex;flex-direction:column}
.spec-head{display:flex;align-items:flex-end;gap:10px 14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.spec-head h2{margin:0;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.spec-head .sub{font-size:15px;color:var(--muted);padding-bottom:5px}
.spec-head .dday{margin-left:auto;font-family:var(--f-mono);font-size:14px;padding-bottom:5px}
.rowx{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px dashed var(--dash)}
.rowx:last-child{border-bottom:0}
.rowx>.lbl{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px;word-break:keep-all}
.rowx>.val{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
.ptags{display:flex;flex-wrap:wrap;gap:6px}
.ptag{font-family:var(--f-mono);font-size:12.5px;background:var(--chip-bg);color:var(--chip-fg);padding:3px 8px}
.copy{border:1px solid var(--rule);background:var(--surface);font-family:var(--f-mono);font-size:12px;padding:4px 10px;min-height:30px}
.copy:hover{background:var(--bg)}
.copy.strong{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.75;max-width:68ch}
.code{font-family:var(--f-mono);font-size:13px;line-height:1.7;background:var(--code-bg);color:var(--code-fg);padding:12px 14px;width:100%;overflow-wrap:anywhere}
.sw{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:5px;border:1px solid var(--rule)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.gal.one{grid-template-columns:1fr}
.gal.two{grid-template-columns:1fr 1fr}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in;background:var(--bg)}
.gal.one img{aspect-ratio:auto;max-height:520px;object-fit:contain}

/* editor + settings */
.form{display:flex;flex-direction:column;gap:14px;padding:22px 26px 26px}
.form h3{margin:0;font-size:22px;letter-spacing:-.01em}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.f .lab{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.f .hint{color:var(--muted);opacity:.85}
.f input[type=text],.f input[type=date],.f input[type=number],.f textarea,.f select{border:1px solid var(--rule);background:var(--bg);padding:9px 11px;width:100%;border-radius:0}
.f textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick .pv{width:84px;height:112px;border:1px solid var(--rule);background:var(--bg);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.imgpick .pv img{width:100%;height:100%;object-fit:cover}
.btn{border:1px solid var(--rule);background:var(--surface);padding:6px 12px;font-size:13px;min-height:34px}
.btn:hover{background:var(--bg)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--danger)}
.colors{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cdot{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--rule)}
.cdot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.colors input[type=color]{width:32px;height:28px;border:1px solid var(--rule);background:none;padding:0}
.block{border:1px solid var(--rule);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.bhead{display:flex;gap:6px;align-items:center}
.bhead .kind{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;padding:0 6px;flex:none}
.bhead input{flex:1;border:0;border-bottom:1px solid var(--dash);background:none;padding:4px 2px;font-weight:600;min-width:0}
.icon-btn{border:0;background:none;color:var(--muted);padding:4px 7px;min-width:30px;min-height:30px}
.icon-btn:hover{color:var(--ink);background:var(--bg)}
.icon-btn:disabled{opacity:.35;cursor:default}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .t{position:relative;width:64px;height:64px;overflow:hidden;background:var(--bg);border:1px solid var(--rule)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:2px;right:2px;border:0;width:20px;height:20px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:1;padding:0}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:14px}
.foot .left{margin-right:auto}
.busy{font-size:12px;color:var(--muted)}

.lb{position:fixed;inset:0;background:rgba(5,6,8,.9);display:none;place-items:center;z-index:30;padding:20px;cursor:zoom-out}
.lb.open{display:grid}
.lb img{max-width:100%;max-height:92vh;object-fit:contain}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;font-family:var(--f-mono);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.show{opacity:1}

/* tablet */
@media (max-width:1080px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.compact{grid-template-columns:repeat(4,minmax(0,1fr))}
}
/* phone */
html.L-mo body{font-size:14.5px}html.L-mo .strip{height:96px}html.L-mo .head-in{padding:20px 16px 16px;gap:14px;position:relative}html.L-mo .gear{position:absolute;top:16px;right:16px}html.L-mo .who{padding-right:52px}html.L-mo .who{flex-basis:100%;gap:12px}html.L-mo .av{width:52px;height:52px;font-size:20px}html.L-mo .who h1{font-size:30px}html.L-mo .stats{gap:0;width:100%;border-top:1px solid var(--rule);padding-top:12px}html.L-mo .stat{flex:1}html.L-mo .stat b{font-size:20px}html.L-mo .wrap{padding:16px 16px 56px;gap:14px}html.L-mo .search{flex-basis:100%}html.L-mo #sortSeg{flex:1 1 100%}html.L-mo .bar .seg button{flex:1 0 auto;padding:0 12px}html.L-mo .bar>.add-btn{flex:1 1 auto}html.L-mo .side .cover{max-width:280px}html.L-mo .tagbar{width:100%}html.L-mo .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}html.L-mo .grid.compact{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}html.L-mo .card:hover{transform:none;box-shadow:none}html.L-mo .card-top{padding:7px 9px;font-size:11px}html.L-mo .thumb{margin:8px}html.L-mo .info{padding:0 10px 10px;gap:4px}html.L-mo .nm h2{font-size:16px}html.L-mo .nm span{font-size:12px}html.L-mo .hash{font-size:12px}html.L-mo .overlay{padding:0;align-items:stretch}html.L-mo .modal,html.L-mo .modal.narrow{width:100%;max-height:none;height:100%;border:0}html.L-mo .side{border-right:0;border-bottom:1px solid var(--rule);padding:16px}html.L-mo .side .cover{width:100%;margin:0 auto}html.L-mo .spec{padding:18px 16px 28px}html.L-mo .spec-head h2{font-size:30px}html.L-mo .spec-head .dday{margin-left:0}html.L-mo .rowx{grid-template-columns:1fr;gap:6px}html.L-mo .form{padding:18px 16px 24px}html.L-mo .two{grid-template-columns:1fr}
/* ---- 발췌 사이트와 맞춘 모양 ---- */
html.ui-dark .chip{color:color-mix(in srgb,var(--tc) 50%,#fff)}
.chip{color:var(--tc,var(--ink));border-radius:999px;padding:1px 8px}
body{font-size:15px}

/* app bar, same as 발췌 */
.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--dash)}
html.ui-dark .appbar{background:rgba(15,16,18,.9)}
.top-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 40px}
.logo{font-weight:700;font-size:16px;letter-spacing:-.4px;margin-right:auto;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--ink);display:inline-block;position:relative;flex:none}
.logo i::after{content:"";position:absolute;left:5px;right:5px;top:7px;height:2px;background:var(--surface);box-shadow:0 4px 0 var(--surface)}
.logo-sub{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:7px;letter-spacing:0}
.svc{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.svc a{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap}
.svc a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
html.ui-dark .svc a[aria-current="page"]{background:#2d2e34;box-shadow:none}
.in-claude .svc,.in-claude .logo-home{display:none}
.tbtn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:500;min-height:38px}
.uipop{position:relative}
.uimenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);display:none;flex-direction:column;gap:8px;min-width:220px;z-index:30}
.uimenu.on{display:flex}
.uimenu small{font-size:12px;color:var(--muted)}

/* header */
.head{background:var(--surface);border-bottom:1px solid var(--dash)}
.av{border-radius:14px;border-color:var(--rule)}
.who h1{font-size:34px;letter-spacing:-.6px}
.eyebrow{letter-spacing:.08em}
.stat b{font-size:24px}
.gear{border-radius:10px;border-color:var(--rule)}
.strip{border-bottom:1px solid var(--dash)}

/* controls: same pill + segmented look as 발췌 */
.search{border-radius:10px;border-color:var(--rule)}
.seg{background:var(--soft);border:0;border-radius:10px;padding:3px;gap:2px;height:44px;font-family:var(--f-body)}
.seg button{border:0 !important;border-radius:8px;color:var(--muted);padding:0 13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
html.ui-dark .seg button[aria-pressed="true"]{background:#2d2e34;box-shadow:none}
.add-btn{border-radius:10px;font-weight:700}
.tagbar{border:0;background:none;gap:6px;width:auto;padding-bottom:2px}

/* detail + forms */

.side{border-right-color:var(--dash);background:var(--paper)}

.spec-head{border-bottom-color:var(--rule)}
.ptag{border-radius:6px}
.copy{border-radius:8px;border-color:var(--rule)}

.code{border-radius:10px}
.gal img{border-radius:8px}
.sw{border-radius:3px}
.f input[type=text],.f input[type=date],.f input[type=number],.f textarea,.f select{border-radius:10px;border-color:var(--rule);background:var(--surface)}

html.L-mo .top-in{padding:10px 16px;gap:6px}html.L-mo .logo span{display:none}html.L-mo .svc a{padding:6px 10px}html.L-mo .who h1{font-size:26px}html.L-mo .seg{height:42px}html.L-mo .modal,html.L-mo .modal.narrow{border-radius:0}
/* tag picker + tag manager */
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagopt{border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;min-height:32px}
.tagopt::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tc);margin-right:6px;vertical-align:1px}
.tagopt[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff;font-weight:700}
.tagopt[aria-pressed="true"]::before{background:#fff}
.tm-row{border:1px solid var(--rule);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.tm-top{display:flex;align-items:center;gap:6px}
.tm-top input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--dash);background:none;padding:5px 2px;font-weight:600}
.tm-dot{width:12px;height:12px;border-radius:50%;flex:none}
.tm-count{white-space:nowrap}
.tm-row .cdot{width:22px;height:22px}

/* stacking: the detail window sits above the sticky app bar */
.overlay{z-index:50}
.lb{z-index:60}
.toast{z-index:70}
/* 모바일 레이아웃을 PC에서 골랐을 때: 가운데 좁은 열 */
html.L-mo .wrap,html.L-mo .head-in,html.L-mo .top-in{max-width:560px}
html.L-mo .modal,html.L-mo .modal.narrow{max-width:560px}

/* list view */
.grid.list{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--dash);border-radius:16px;overflow:hidden}
.lrow{display:grid;grid-template-columns:44px minmax(0,1.3fr) minmax(0,1fr) 120px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--dash);cursor:pointer}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--soft)}

html.L-mo .lrow{grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"th main dd" "th chips chips";gap:4px 12px;padding:10px 12px}

/* pair section */

/* 통일된 글씨: 한 글꼴, 굵기·크기만 다르게 */
.eyebrow{letter-spacing:.06em;font-weight:500;font-size:11.5px}

.chip{font-weight:500;font-size:11.5px}
.ptag{font-size:13px}
.copy,.mbtn,.mtop{font-weight:500;letter-spacing:.01em}
.code{font-size:13.5px;line-height:1.75}
.card-top{font-size:12px;font-weight:500}

/* 눌린 태그는 그 태그 색으로 (ALL은 검정 그대로) */
.tagbtn[style*="--tc"]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tc);margin-right:6px;vertical-align:1px}

/* 파스텔 하트 점이 흰 바탕에서도 보이게 */
.hdot,.cdot{box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}

/* ---- page tabs (캐릭터 / 프롬 노트) ---- */
.pages-wrap{max-width:1360px;margin:0 auto;padding:0 40px}

function cache(){ const ok = lsSet(LS_KEY, {chars: kind==="mine" ? chars : (store.mine||[]), settings, savedAt:Date.now()}); if(!ok && standaloneEdit) toast("브라우저 저장 공간이 가득 찼어요. 지금 내보내기로 data.json을 받아 두세요."); }
async function saveChar(c){
  if(mode==="firebase"){
    if(!fb || !canEdit){ toast("편집하려면 로그인해 주세요."); return false; }
    const before = chars.find(x=>x.id===c.id);
    try{
      c = await fsNormalizeChar(c);
      await fb.fs.setDoc(fb.fs.doc(fb.db,KINDS[kind].coll,c.id), c);
      const j = chars.findIndex(x=>x.id===c.id); if(j>=0) chars[j]=c; else chars.push(c);
      render();
      if(before) await fsDeleteUnused(charRefs(before).filter(r=>!charRefs(c).includes(r)), null);
      return true;
    }catch(e){ fbFailed(e); return false; }
  }
  const i = chars.findIndex(x=>x.id===c.id);
  if(i>=0) chars[i]=c; else chars.push(c);
  cache(); render();
  if(mode==="cloud"){
    try{ await db.doc("chars/"+c.id).set(c); }
    catch(e){ writeFailed(e); }
  }
}
async function deleteChar(id){
  if(mode==="firebase"){
    if(!fb || !canEdit) return;
    const old = chars.find(x=>x.id===id);
    try{ await fb.fs.deleteDoc(fb.fs.doc(fb.db,KINDS[kind].coll,id)); chars = chars.filter(x=>x.id!==id); store[kind] = chars; render(); if(old) await fsDeleteUnused(charRefs(old), id); return true; }
    catch(e){ fbFailed(e); return false; }
  }
  chars = chars.filter(x=>x.id!==id); cache(); render();
  if(mode==="cloud"){ try{ await db.doc("chars/"+id).delete(); }catch(e){ writeFailed(e); } }
}
async function saveSettings(s){
  if(mode==="firebase"){
    if(!fb || !canEdit){ toast("편집하려면 로그인해 주세요."); return false; }
    try{
      s = JSON.parse(JSON.stringify(s));
      s.banner = await fsNormalizeRef(s.banner,"siteImages","si:"); s.avatar = await fsNormalizeRef(s.avatar,"siteImages","si:");
      Object.keys(s).forEach(k=>{ if(s[k]===undefined||s[k]===null) delete s[k]; });
      await fb.fs.setDoc(fb.fs.doc(fb.db,"site","settings"), s);
      settings = s; renderBanner(); render();
      return true;
    }catch(e){ fbFailed(e); return false; }
  }
  settings = s; cache(); renderBanner(); render();
  if(mode==="cloud"){ try{ await db.doc("site/settings").set(s); }catch(e){ writeFailed(e); return false; } }
  return true;
}
function writeFailed(e){
  if(e && e.code==="quota_exceeded"){ toast("저장 공간이 가득 찼어요. 안 쓰는 항목을 지워 주세요."); return; }
  if(e && e.code==="invalid_argument" && /256|size|large/i.test(e.message||"")){ toast("내용이 너무 길어요. 이미지 수나 글 길이를 줄여 주세요."); return; }
  if(e && e.code==="invalid_argument"){ canEdit=false; render(); toast("이 링크에서는 보기만 할 수 있어요."); return; }
  toast("저장에 실패했어요. 잠시 후 다시 시도해 주세요.");
}

/* image: shrink, then upload (cloud) or embed (local) */
async function prepImage(file){
  if(file.type==="image/gif" && file.size < 8*1024*1024) return file;
  const max = assets ? 1600 : 900;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",assets?0.9:0.8));
  }catch(e){ return file; }
}
async function storeImage(file, target){
  if(mode==="firebase"){ if(!fb || !canEdit){ toast("편집하려면 로그인해 주세요."); return null; } const t = target==="site" ? {coll:"siteImages",prefix:"si:"} : imgTarget(); return await fsImageFromBlob(file, t.coll, t.prefix); }
  const blob = await prepImage(file);
  if(assets){
    try{ const r = await assets.upload(blob, blob.type?undefined:{type:"image/jpeg"}); return r.id; }
    catch(e){
      if(e && e.code==="too_large") toast("이미지가 너무 커요 (20MB 이하).");
      else if(e && e.code==="quota_or_state") toast("이미지 저장 공간이 가득 찼어요.");
      else toast("이미지를 올리지 못했어요. 다시 시도해 주세요.");
      return null;
    }
  }
  return await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.onerror=()=>r(null); fr.readAsDataURL(blob); });
}
function pickFiles(multiple){
  return new Promise(res=>{
    const inp=$("fileIn"); inp.multiple=!!multiple; inp.value="";
    inp.onchange=()=>res(Array.from(inp.files||[]));
    inp.click();
  });
}

async function saveTags(){
  readTagNames();
  const live = tagDraft.map(t=>({...t, name:t.name.trim()})).filter(t=>t.name);
  const names = live.map(t=>t.name);
  if(new Set(names).size !== names.length){ toast("같은 이름의 태그가 있어요. 이름을 바꿔 주세요."); return; }
  const rename = {}; live.forEach(t=>{ if(t.orig && t.orig!==t.name) rename[t.orig]=t.name; });
  const keep = new Set(live.filter(t=>t.orig).map(t=>t.orig));
  const removed = allTags().filter(t=>!keep.has(t));
  const s = JSON.parse(JSON.stringify(settings));
  s[tagOrderKey()] = names; s.tagColors = Object.assign({}, s.tagColors||{}); removed.forEach(t=>{ delete s.tagColors[t]; }); Object.keys(rename).forEach(t=>{ delete s.tagColors[t]; }); live.forEach(t=>{ s.tagColors[t.name]=t.color; });

}

function resolvePairLink(link){
  if(!link) return null;

  return chars.find(x=>x.id===link) || null;
}
function pairData(c, b){
  const linked = resolvePairLink(b.link);
  let groups = (b.groups||[]).map(g=>({label:g.label||"태그", items:splitTags(g.text)})).filter(g=>g.items.length);
  if(!groups.length && linked) groups = (linked.blocks||[]).filter(x=>x.type==="tags").map(x=>({label:x.label||"태그", items:splitTags(x.text)})).filter(g=>g.items.length);
  const coupleItems = splitTags(b.couple);
  const pairAll = groups.flatMap(g=>g.items);
  const owner = b.of ? (c.blocks||[]).find(x=>x.id===b.of) : null;
  const mainAll = owner ? (owner.groups||[]).flatMap(g=>splitTags(g.text)) : (c.blocks||[]).filter(x=>x.type==="tags").flatMap(x=>splitTags(x.text));

  const tags = (d.blocks||[]).filter(b=>b.type==="tags");

async function savePlats(btn){
  readPlatNames();
  const live = platDraft.map(t=>({...t, name:t.name.trim()})).filter(t=>t.name);
  if(new Set(live.map(t=>t.name)).size !== live.length){ toast("같은 이름의 플랫폼이 있어요."); return; }
  const rename = {}; live.forEach(t=>{ if(t.orig && t.orig!==t.name) rename[t.orig]=t.name; });
  const keep = new Set(live.filter(t=>t.orig).map(t=>t.orig));
  const removed = allPlatforms().filter(p=>!keep.has(p));
  if(btn) btn.disabled = true;
  for(const c of (store.ai || chars).slice()){
    if(!c.platform || !(rename[c.platform] || removed.includes(c.platform))) continue;
    const nc = JSON.parse(JSON.stringify(c)); nc.platform = rename[c.platform] || ""; nc.updatedAt = Date.now();
    if((await saveChar(nc))===false){ if(btn) btn.disabled=false; return; }
  }
  const s = JSON.parse(JSON.stringify(settings)); s.platforms = live.map(t=>({name:t.name, color:t.color}));
  if(!(await saveSettings(s))){ if(btn) btn.disabled=false; return; }
  if(filt.platform && (removed.includes(filt.platform) || rename[filt.platform])) filt.platform = rename[filt.platform] || null;
  closeModal(); render(); toast("플랫폼을 저장했어요");
}

function canSee(k){ return canEdit ? true : visOf(k)==="public"; }
function notesVisible(){ return multiKind() && canSee("notes"); }
function tagOrderKey(){ return kind==="mine" ? "tagOrder" : "tagOrder_"+kind; }
function pageOrder(){
  const o = (vis && Array.isArray(vis.order)) ? vis.order.filter(k=>PAGE_ORDER.includes(k)) : [];
  return o.concat(PAGE_ORDER.filter(k=>!o.includes(k)));
}
function visiblePages(){
  if(!multiKind()) return ["mine"];
  return pageOrder().filter(k=> k==="notes" ? notesVisible() : canSee(k));
}
function imgTarget(){ const k = KINDS[kind] || KINDS.mine; return {coll:k.img, prefix:k.prefix}; }

/* subscriptions */
function subKind(k){
  if(kindSubs[k] || !fb) return;
  kindSubs[k] = fb.fs.onSnapshot(fb.fs.collection(fb.db, KINDS[k].coll), snap=>{
    store[k] = snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    if(k==="mine" && localReason) localReason = "";
    if(k===kind && page!=="notes"){ chars = store[k]; cache(); render(); refreshOpenChar(); }
    renderTabs();
  }, err=>{
    kindSubs[k] = null; store[k] = [];
    if(err && err.code==="permission-denied" && visLoaded && canSee(k)){
      localReason = canEdit ? "Firestore 규칙이 예전 버전이에요. 안내받은 새 규칙을 붙여넣고 게시해 주세요." : "";
    }
    if(k===kind && page!=="notes"){ chars = []; render(); }
    renderTabs();
  });
}
function unsubKind(k){ if(kindSubs[k]){ try{ kindSubs[k](); }catch(e){} kindSubs[k] = null; } }
function syncSubs(){
  if(!fb || !visLoaded) return;
  for(const k in KINDS){ if(canSee(k)) subKind(k); else { unsubKind(k); store[k] = null; } }
  if(notesVisible()) startNotes(); else stopNotes();
}
function refreshOpenChar(){ if(openId && !draft && !editingSettings && $("ov").classList.contains("open")) viewChar(openId); }
function subVis(){
  fb.fs.onSnapshot(fb.fs.doc(fb.db,"site","visibility"), snap=>{
    vis = snap.exists() ? Object.assign({}, snap.data()) : {};
    visLoaded = true;
    syncSubs(); setPage(page, true);
  }, ()=>{ visLoaded = true; syncSubs(); setPage(page, true); });
}

/* pages */
function initialPage(){
  const h = location.hash.replace("#","");
  if(PAGE_ORDER.includes(h)) return h;
  if(!canEdit) return "";  /* 방문자는 순서상 첫 번째 공개 탭부터 */
  try{ const p = localStorage.getItem("persona-page"); return p==="chars" ? "mine" : (p||""); }catch(e){ return ""; }
}
function renderTabs(){
  const vp = visiblePages();
  const show = multiKind() && (canEdit || vp.length > 1);
  $("pageTabs").hidden = !show;
  if(!show) return;
  $("pageTabsIn").innerHTML = vp.map(k=>{
    const n = k==="notes" ? notes.length : (store[k] ? store[k].length : (k==="mine" ? chars.length : 0));
    const label = k==="notes" ? "프롬 노트" : KINDS[k].label;
    const badge = !canEdit ? "" : visOf(k)==="public" ? `<span class="pg-pub">공개</span>` : `<span class="pg-lock">${LOCK_SVG}나만</span>`;
    return `<button type="button" role="tab" data-page="${k}" aria-selected="${page===k}">${label} <span class="n">${String(n).padStart(2,"0")}</span>${badge}</button>`;
  }).join("");
}
function setPage(p, fromHash){
  if(p==="chars") p = "mine";
  const vp = visiblePages();
  const closed = multiKind() && visLoaded && !vp.length;
  if(!vp.includes(p)) p = vp[0] || "mine";
  page = p;
  if(p!=="notes"){
    if(kind!==p) { kind = p; filt.tag = null; filt.platform = null; filt.reorder = false; }
    if(store[p]) chars = store[p]; else if(p!=="mine") chars = [];
  }
  if(canEdit){ try{ localStorage.setItem("persona-page", page); }catch(e){} }
  if(!fromHash){ try{ history.replaceState(null, "", page==="mine" ? location.pathname+location.search : "#"+page); }catch(e){} }
  $("closedView").hidden = !closed; document.body.classList.toggle("is-closed", closed);
  $("charsView").hidden = closed || page==="notes";
  $("notesView").hidden = closed || page!=="notes";
  $("mixBar").hidden = closed || page!=="notes";
  document.body.classList.toggle("on-notes", page==="notes");
  renderTabs(); renderBanner();
  if(page==="notes") renderNotes(); else render();
}
window.addEventListener("hashchange", ()=>{ const h=location.hash.replace("#",""); if(PAGE_ORDER.includes(h)) setPage(h, true); });

/* banner/profile images live in a public collection so they show even when 내 페르소나 is 나만 보기 */
async function migrateSiteImages(){
  if(!canEdit || !fb || migratedSite) return;
  migratedSite = true;
  const s = JSON.parse(JSON.stringify(settings)); let changed = false;
  for(const k of ["banner","avatar"]){
    if(s[k] && s[k].startsWith("fs:")){
      const d = await loadFsImg(s[k].slice(3), "images");
      if(d){ const id = newId(); try{ await fb.fs.setDoc(fb.fs.doc(fb.db,"siteImages",id), {data:d, createdAt:Date.now()}); fsImg[id]=d; s[k]="si:"+id; changed=true; }catch(e){} }
    }
  }
  if(changed) await saveSettings(s);
}

function withNames(c){ return (c.with||[]).map(id=>(store.mine||[]).find(x=>x.id===id)).filter(Boolean); }
function kindRows(c){
  const out = [];

    const st = AI_STATUS.find(x=>x[0]===c.status);

function lpTags(k, items){
  const order = (settings[k==="mine" ? "tagOrder" : "tagOrder_"+k]||[]).slice();
  items.forEach(c=>(c.tags||[]).forEach(t=>{ if(!order.includes(t)) order.push(t); }));
  return order.filter(t=>items.some(c=>(c.tags||[]).includes(t)));
}
function lpFiltered(k){
  const q = lp.q.trim().toLowerCase();
  return lpItems(k).filter(c=>(!lp.plat || (lp.plat==="__none" ? !c.platform : c.platform===lp.plat)) && (!lp.tag || (c.tags||[]).includes(lp.tag)) && (!q || `${c.name||""} ${c.sub||""} ${c.hashtags||""}`.toLowerCase().includes(q)));

function linkPickHtml(k, sel){

      ${tags.length?`<div class="lp-row"><span class="lp-lab">분류</span><div class="lp-fs">${chip("data-lptag","",lp.tag,"전체",items.length)}${tags.map(t=>chip("data-lptag",t,lp.tag,t,items.filter(c=>(c.tags||[]).includes(t)).length,tagColor(t))).join("")}</div></div>`:""}
      <div class="lp-list" id="lp-list">${lpListHtml(k)}</div>

    <div class="tagpick">${picked.map(c=>`<button type="button" class="tagopt" data-lpick="${esc(c.id)}" aria-pressed="true" style="--tc:${esc(lpColor(k,c))}" title="눌러서 빼기">${esc(c.name||"이름 없음")} ✕</button>`).join("")}
      ${items.length ? `<button type="button" class="btn lp-open" data-lpopen aria-expanded="${lp.open}">${lp.open?"접기 ▲":(picked.length?"+ 더 고르기":"+ 고르기")}</button>` : `<span class="busy">${k==="ai"?"AI 캐릭터":"내 페르소나"}가 아직 없어요</span>`}</div>
    ${panel}</div>`;

const PAGE_NAMES = {mine:"내 페르소나", ai:"AI 캐릭터", friend:"친구 페르소나", notes:"프롬 노트"};

async function saveVis(){
  if(!visDraft || !multiKind() || !canEdit) return true;
  const same = ["mine","ai","friend","notes"].every(k=>visDraft[k]===visOf(k)) && visDraft.order.join()===pageOrder().join();
  if(same) return true;
  try{ await fb.fs.setDoc(fb.fs.doc(fb.db,"site","visibility"), visDraft); vis = Object.assign({}, visDraft); return true; }
  catch(e){ fbFailed(e); return false; }
}

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return; const d = b.dataset;
  if(d.page){ setPage(d.page); return; }
  if(d.vmove && visDraft){ const [i,s2]=d.vmove.split("|").map(Number); const j=i+s2; const o=visDraft.order; if(j>=0&&j<o.length){ [o[i],o[j]]=[o[j],o[i]]; } const box=$("visBox"); if(box) box.outerHTML = visSettingsHtml(); return; }
  if(d.vis){ const [k,v]=d.vis.split("|"); visDraft[k]=v; b.parentElement.querySelectorAll("[data-vis]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.vis===d.vis)); return; }
  if(d.kstatus && draft){ draft.status = draft.status===d.kstatus ? "" : d.kstatus; b.parentElement.querySelectorAll("[data-kstatus]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.kstatus===draft.status)); return; }
  if(d.kwith && draft){ const w = draft.with = draft.with||[]; const on = !w.includes(d.kwith); draft.with = on ? [...w, d.kwith] : w.filter(x=>x!==d.kwith); b.setAttribute("aria-pressed", on); return; }
  if(d.kai && draft){ const w = draft._ai = draft._ai||[]; const on = !w.includes(d.kai); draft._ai = on ? [...w, d.kai] : w.filter(x=>x!==d.kai); b.setAttribute("aria-pressed", on); return; }
  if(d.gochar){ const id = d.gochar; closeModal(); setPage("mine"); setTimeout(()=>viewChar(id), 30); return; }
  if(d.lk){ const m=$("modal"), y=m.scrollTop; lkOpen = lkOpen===d.lk ? null : d.lk; if(openId) viewChar(openId); m.scrollTop=y; return; }
  if(d.lkgo){ const [k,id] = splitLk(d.lkgo); closeModal(); setPage(k); setTimeout(()=>viewChar(id), 30); return; }
  if(d.lkcopy){ const [k,id,bid] = d.lkcopy.split("|"); const c=(store[k]||[]).find(x=>x.id===id); const bl=c&&(c.blocks||[]).find(x=>x.id===bid); if(bl) copy(bl.type==="tags" ? splitTags(bl.text).join(", ") : bl.text); return; }
});

/* ================= 프롬 노트 (나만 보기) ================= */
const DEFAULT_CATS = [
  {id:"artist",name:"작가 태그",color:"#7c3aed"},{id:"style",name:"화풍·질감",color:"#db2777"},
  {id:"pose",name:"구도·포즈",color:"#2563eb"},{id:"bg",name:"배경·조명",color:"#0d9488"},
  {id:"outfit",name:"의상",color:"#ea580c"},{id:"neg",name:"네거티브",color:"#dc2626"},{id:"memo",name:"메모",color:"#71717a"}
];
let page = "mine", notes = [], noteCfg = null, notesSubs = [], nFilt = {cat:"all", q:"", sort:"recent"};
let noteDraft = null, catDraft = null, mixList = [];
try{ mixList = JSON.parse(localStorage.getItem("persona-mix")||"[]")||[]; }catch(e){ mixList=[]; }
function saveMix(){ try{ localStorage.setItem("persona-mix", JSON.stringify(mixList)); }catch(e){} }
function notesEnabled(){ return mode==="firebase" && canEdit && !!fb; }
function cats(){ return (noteCfg && Array.isArray(noteCfg.cats)) ? noteCfg.cats : DEFAULT_CATS; }
function catById(id){ return cats().find(c=>c.id===id) || null; }
function weighted(text, w){ const r=Math.round(w*10)/10; return r===1 ? text : `${r}::${text} ::`; }

function startNotes(){
  if(notesSubs.length || !fb) return;
  notesSubs.push(fb.fs.onSnapshot(fb.fs.collection(fb.db,"notes"), snap=>{
    notes = snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    mixList = mixList.filter(m=>notes.some(n=>n.id===m.id));
    if(page==="notes"){ renderBanner(); renderNotes(); }
    if(openId && !draft && !editingSettings && $("ov").classList.contains("open")) viewChar(openId);
  }, err=>{ if(err && err.code==="permission-denied"){ notesDenied = true; if(page==="notes") renderNotes(); } }));
  notesSubs.push(fb.fs.onSnapshot(fb.fs.doc(fb.db,"private","notes"), snap=>{
    if(catDraft) return;
    noteCfg = snap.exists() ? Object.assign({}, snap.data()) : null;
    if(page==="notes"){ renderBanner(); renderNotes(); }
  }, ()=>{}));
}
let notesDenied = false;
function stopNotes(){ notesSubs.forEach(u=>{ try{ u(); }catch(e){} }); notesSubs = []; notes = []; noteCfg = null; notesDenied = false; }

/* ---------- render ---------- */
function noteCats(){
  const cs = cats().slice();
  if(notes.some(n=>!catById(n.cat))) cs.push({id:"__none",name:"미분류",color:"#a1a1aa"});
  return cs;
}
function renderNotes(){
  renderTabs(); $("nAddBtn").hidden = !canEdit;
  if(notesDenied){
    $("nGrid").innerHTML = `<div class="empty">프롬 노트를 읽을 권한이 없어요. Firebase 규칙에 프롬 노트 부분을 추가하고 게시해 주세요.</div>`;
    $("nRail").innerHTML = ""; renderMix(); return;
  }
  const cs = noteCats();
  const cnt = id => id==="all" ? notes.length : id==="__none" ? notes.filter(n=>!catById(n.cat)).length : notes.filter(n=>n.cat===id).length;
  $("nRail").innerHTML = `<div class="t">카테고리</div>` +
    [{id:"all",name:"전체",color:"#71717a"}, ...cs].map(c=>`<button class="ncat" type="button" data-ncat="${esc(c.id)}" aria-pressed="${nFilt.cat===c.id}" style="--c:${esc(c.color)}"><i></i>${esc(c.name)}<span class="n">${cnt(c.id)}</span></button>`).join("") +
    (canEdit ? `<button class="ncat manage" type="button" data-nact="cats">카테고리 관리</button>` : "");
  document.querySelectorAll("#nSortSeg [data-nsort]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.nsort===nFilt.sort));
  const q = nFilt.q.toLowerCase();
  let l = notes.filter(n=>{
    if(nFilt.cat==="__none"){ if(catById(n.cat)) return false; }
    else if(nFilt.cat!=="all" && n.cat!==nFilt.cat) return false;
    if(q && !(`${n.title||""} ${n.text||""} ${(n.chars||[]).map(x=>(x.name||"")+" "+(x.text||"")).join(" ")} ${n.memo||""} ${(n.tags||[]).join(" ")}`.toLowerCase().includes(q))) return false;
    return true;
  });
  if(nFilt.sort==="fav") l = l.filter(n=>n.fav);
  l.sort(nFilt.sort==="used" ? (a,b)=>(b.uses||0)-(a.uses||0) : (a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  $("nGrid").innerHTML = l.length ? l.map(noteCard).join("") :
    `<div class="empty">${notes.length ? "조건에 맞는 프롬이 없어요." : `아직 프롬이 없어요.${canEdit?` <button class="add-btn" type="button" data-nact="new" style="height:34px;margin-left:8px">+ 새 프롬</button>`:""}`}</div>`;
  renderMix();
}

function renderMix(){

/* ---------- save ---------- */
async function saveNote(n){
  if(!notesEnabled()){ toast("편집하려면 로그인해 주세요."); return false; }
  try{
    n = JSON.parse(JSON.stringify(n));
    Object.keys(n).forEach(k=>{ if(n[k]===undefined) delete n[k]; });
    await fb.fs.setDoc(fb.fs.doc(fb.db,"notes",n.id), n);
    const i = notes.findIndex(x=>x.id===n.id); if(i>=0) notes[i]=n; else notes.push(n);
    return true;
  }catch(e){ fbFailed(e); return false; }
}
async function deleteNote(id){
  const old = notes.find(x=>x.id===id);
  try{
    await fb.fs.deleteDoc(fb.fs.doc(fb.db,"notes",id));
    notes = notes.filter(x=>x.id!==id); mixList = mixList.filter(m=>m.id!==id); saveMix();
    if(old) for(const r of (old.thumbs||[])) if(r.startsWith("np:")) { try{ await fb.fs.deleteDoc(fb.fs.doc(fb.db,"noteImages",r.slice(3))); }catch(e){} }
    return true;
  }catch(e){ fbFailed(e); return false; }
}
async function saveNoteCfg(cfg){
  try{ await fb.fs.setDoc(fb.fs.doc(fb.db,"private","notes"), JSON.parse(JSON.stringify(cfg))); noteCfg = cfg; return true; }
  catch(e){ fbFailed(e); return false; }
}

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.ncat!==undefined){ nFilt.cat=d.ncat; renderNotes(); return; }
  if(d.nsort){ nFilt.sort=d.nsort; renderNotes(); return; }
  if(d.nfav){ if(!canEdit) return; const n=notes.find(x=>x.id===d.nfav); if(!n) return; const c=Object.assign({},n,{fav:!n.fav}); if(await saveNote(c)) renderNotes(); return; }
  if(d.ncopy){ const n=notes.find(x=>x.id===d.ncopy); if(!n) return; copy(n.text||""); if(notesEnabled()){ const c=Object.assign({},n,{uses:(n.uses||0)+1}); await saveNote(c); if(page==="notes") renderNotes(); } return; }
  if(d.nmix){ const id=d.nmix; mixList = mixList.some(m=>m.id===id) ? mixList.filter(m=>m.id!==id) : [...mixList,{id,w:1}]; saveMix(); renderNotes(); return; }
  if(d.mixw){ const [id,s]=d.mixw.split("|"); const m=mixList.find(x=>x.id===id); if(m){ m.w=Math.max(.5,Math.min(2,Math.round((m.w+(+s)*.1)*10)/10)); saveMix(); renderMix(); } return; }
  if(d.mixmove){ const [i,s]=d.mixmove.split("|").map(Number); const j=i+s; if(j>=0&&j<mixList.length){ [mixList[i],mixList[j]]=[mixList[j],mixList[i]]; saveMix(); renderMix(); } return; }
  if(d.mixout){ mixList=mixList.filter(m=>m.id!==d.mixout); saveMix(); renderNotes(); return; }
  if(d.nedit){ openNoteEditor(d.nedit); return; }
  if(d.nemode && noteDraft){ readNoteEditor(); if(d.nemode==="multi"){ if(!(noteDraft.chars||[]).length) noteDraft.chars=[{name:"",text:""},{name:"",text:""}]; } else { const has=(noteDraft.chars||[]).some(x=>x.text); if(has && !b.dataset.sure){ b.dataset.sure="1"; toast("캐릭터 프롬이 지워져요. 한 번 더 누르면 1인으로 바꿔요."); return; } noteDraft.chars=[]; } renderNoteEditor(true); return; }
  if(d.nechdel!==undefined && noteDraft){ readNoteEditor(); noteDraft.chars.splice(+d.nechdel,1); renderNoteEditor(true); return; }
  if(d.ncopych){ const [id,i]=d.ncopych.split("|"); const n=notes.find(x=>x.id===id); const ch=n&&(n.chars||[])[+i]; if(ch) copy(ch.text||""); return; }
  if(d.ncopyall){ const n=notes.find(x=>x.id===d.ncopyall); if(n){ copy(noteFullText(n)); if(notesEnabled()){ await saveNote(Object.assign({},n,{uses:(n.uses||0)+1})); if(page==="notes") renderNotes(); } } return; }
  if(d.necat){ readNoteEditor(); noteDraft.cat=d.necat; document.querySelectorAll("[data-necat]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.necat===d.necat)); return; }
  if(d.neuse){ const u=noteDraft.used=noteDraft.used||[]; const on=!u.includes(d.neuse); noteDraft.used = on ? [...u,d.neuse] : u.filter(x=>x!==d.neuse); b.setAttribute("aria-pressed",on); return; }
  if(d.nethrm!==undefined){ readNoteEditor(); noteDraft.thumbs.splice(+d.nethrm,1); renderNoteEditor(true); return; }
  if(d.cmove){ readCatNames(); const [i,s]=d.cmove.split("|").map(Number); const j=i+s; if(j>=0&&j<catDraft.length){ [catDraft[i],catDraft[j]]=[catDraft[j],catDraft[i]]; } renderCatManager(true); return; }
  if(d.ccolor){ readCatNames(); const [i,h]=d.ccolor.split("|"); catDraft[+i].color=h; renderCatManager(true); return; }
  if(d.cdelask!==undefined){ readCatNames(); catDraft.forEach(x=>x.confirm=false); catDraft[+d.cdelask].confirm=true; renderCatManager(true); return; }
  if(d.cdel!==undefined){ readCatNames(); catDraft.splice(+d.cdel,1); renderCatManager(true); return; }
  switch(d.nact){
    case "new": openNoteEditor(null); break;
    case "cats": openCatManager(); break;
    case "closeEd": noteDraft=null; closeModal(); break;
    case "closeCat": catDraft=null; closeModal(); break;

/* ---------- derived ---------- */
function list(){ if(chars.length || kind!=="mine") return chars; const hid = settings.hiddenExamples||[]; return EXAMPLES.filter(e=>!hid.includes(e.id)); }
function allTags(){
  const order = (settings[tagOrderKey()]||[]).slice();
  // 예시 카드의 태그는, 아직 캐릭터도 태그 설정도 없을 때만 보여줘요 (지운 태그가 예시에서 되살아나지 않게)
  const src = chars.length || kind!=="mine" || Array.isArray(settings[tagOrderKey()]) ? chars : EXAMPLES;
  const used=[]; src.slice().sort((a,b)=>(a.order||0)-(b.order||0)).forEach(c=>(c.tags||[]).forEach(t=>{ if(!used.includes(t)) used.push(t); }));
  return order.concat(used.filter(t=>!order.includes(t)));
}
let mvBusy = false;
async function moveChar(id, dir){
  if(mvBusy || !canEdit) return;
  const vis = filtered(); const i = vis.findIndex(c=>c.id===id), j = i+dir;
  if(i<0 || j<0 || j>=vis.length) return;
  const full = chars.slice().sort((a,b)=>(a.order||0)-(b.order||0) || (a.createdAt||0)-(b.createdAt||0));
  const a = full.findIndex(c=>c.id===vis[i].id), b = full.findIndex(c=>c.id===vis[j].id);
  [full[a], full[b]] = [full[b], full[a]];
  const changed = []; full.forEach((c,k)=>{ if(c.order!==k+1) changed.push({...c, order:k+1}); });
  if(!changed.length) return;
  mvBusy = true;
  try{ for(const c of changed){ if((await saveChar(c))===false) break; } }
  finally{ mvBusy = false; }
  const el = document.querySelector(`[data-mv="${CSS.escape(id)}:${dir}"]`); if(el) el.focus();
}
function filtered(){
  const q = filt.q.trim().toLowerCase();
  let l = list().filter(c=>{
    if(filt.tag && !(c.tags||[]).includes(filt.tag)) return false;
    if(kind==="ai" && filt.platform && (filt.platform==="__none" ? !!c.platform : c.platform!==filt.platform)) return false;
    if(q && !(`${c.name} ${c.sub||""} ${c.hashtags||""} ${(c.tags||[]).join(" ")} ${pairNames(c).join(" ")} ${c.platform||""} ${c.maker||""} ${c.owner||""} ${fpBlocks(c).map(b=>(b.name||"")+" "+(b.groups||[]).map(g=>g.text||"").join(" ")).join(" ")}}`.toLowerCase().includes(q))) return false;
    return true;
  });
  const by = {
    order:(a,b)=>(a.order||0)-(b.order||0),
    name:(a,b)=>String(a.name).localeCompare(String(b.name),"ko"),
    dday:(a,b)=>(dday(b.start)||-1)-(dday(a.start)||-1),
    created:(a,b)=>(b.createdAt||0)-(a.createdAt||0)
  }[filt.sort];
  l.sort(by); if(filt.rev) l.reverse();
  return l;
}

function readEditor(){
  if(!draft) return;
  document.querySelectorAll("[data-f]").forEach(el=>draft[el.dataset.f]=el.value.trim());
  const o=$("e-order"); if(o) draft.order = Number(o.value)||0;
  const kc=$("k-chats"); if(kc) draft.chats = Number(kc.value)||0;
  const cb=$("e-comb"); if(cb) draft.combined = cb.checked;
  document.querySelectorAll("[data-blabel]").forEach(el=>{ const b=draft.blocks.find(x=>x.id===el.dataset.blabel); if(b) b.label=el.value; });
  document.querySelectorAll("[data-btext]").forEach(el=>{ const b=draft.blocks.find(x=>x.id===el.dataset.btext); if(b) b.text=el.value; });
  document.querySelectorAll("[data-pf]").forEach(el=>{ const [bid,f]=el.dataset.pf.split("|"); const b=draft.blocks.find(x=>x.id===bid); if(b) b[f]=el.value; });
  document.querySelectorAll("[data-pg]").forEach(el=>{ const [bid,gi,f]=el.dataset.pg.split("|"); const b=draft.blocks.find(x=>x.id===bid); if(b&&b.groups&&b.groups[+gi]) b.groups[+gi][f]=el.value; });
  if(kind==="friend") readFriendEditor();
}
async function saveEdit(){
  readEditor();
  const now=Date.now(), c = JSON.parse(JSON.stringify(draft));
  if(c.example){ c.id=newId(); }
  const pickedAi = c._ai, exId = draft.id;
  delete c.example; delete c._new; delete c.wasExample; delete c._ai;
  if(!c.name) c.name="이름 없음";
  c.createdAt = c.createdAt || now; c.updatedAt = now;
  c.blocks = (c.blocks||[]).filter(b=> b.type==="fpersona" ? ((b.name||"").trim() || b.image || (b.note||"").trim() || (b.groups||[]).some(g=>(g.text||"").trim())) : b.type==="images" ? (b.images||[]).length : (b.text||"").trim() || b.label);
  const ok = await saveChar(c);
  if(kind==="mine" && Array.isArray(pickedAi) && ok!==false && store.ai){
    for(const a of store.ai.slice()){
      const has = (a.with||[]).includes(c.id) || (exId!==c.id && (a.with||[]).includes(exId));
      const want = pickedAi.includes(a.id);
      if(has!==want || (want && !(a.with||[]).includes(c.id))) await setAiWith(a.id, c.id, want);
    }
  }
  viewChar(c.id); toast("저장했어요");
}

function canDownload(){ return !!downloadsNs || standalone; }
async function downloadText(filename, text){
  const blob = new Blob([text],{type:"application/json"});
  if(downloadsNs){ await downloadsNs.save({filename, data:blob}); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
async function inlineRef(ref, memo){
  if(ref && ref.startsWith("fs:")) return (await loadFsImg(ref.slice(3))) || ref;
  if(!ref || ref.startsWith("data:") || /^https?:/.test(ref)) return ref;
  if(memo[ref]) return memo[ref];
  try{
    const r = await fetch(src(ref)); if(!r.ok) return ref;
    const b = await r.blob();
    const d = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(ref); fr.readAsDataURL(b); });
    memo[ref]=d; return d;
  }catch(e){ return ref; }
}
async function exportSite(){
  const memo={}, out=JSON.parse(JSON.stringify({app:"persona-gallery",version:2,exportedAt:new Date().toISOString(),settings,chars}));
  let total=0, done=0;
  out.chars.forEach(c=>{ if(c.cover) total++; (c.blocks||[]).forEach(b=>{ total+=(b.images||[]).length; if(b.image) total++; }); });
  if(out.settings.banner) total++; if(out.settings.avatar) total++;
  const tick=()=>{ const el=$("busy-exp"); if(el) el.textContent=`이미지 담는 중… ${++done}/${total}`; };
  if(out.settings.banner){ out.settings.banner=await inlineRef(out.settings.banner,memo); tick(); }
  if(out.settings.avatar){ out.settings.avatar=await inlineRef(out.settings.avatar,memo); tick(); }
  for(const c of out.chars){
    if(c.cover){ c.cover=await inlineRef(c.cover,memo); tick(); }
    for(const b of (c.blocks||[])){ if(b.images) for(let i=0;i<b.images.length;i++){ b.images[i]=await inlineRef(b.images[i],memo); tick(); } if(b.image){ b.image=await inlineRef(b.image,memo); tick(); } }
  }
  const text = JSON.stringify(out);
  try{ await downloadText("data.json", text); const el=$("busy-exp"); if(el) el.textContent=`data.json을 만들었어요 (${(text.length/1048576).toFixed(1)}MB).`; }
  catch(e){ toast("파일 저장이 취소됐어요."); }
}

async function doImport(text){
  let p; try{ p=JSON.parse(text); }catch(e){ toast("JSON 형식이 아니에요."); return; }
  const arr = Array.isArray(p)?p:(p&&Array.isArray(p.chars)?p.chars:null);
  if(!arr){ toast("chars 목록을 찾지 못했어요."); return; }
  let n=0;
  for(const r of arr){
    if(!r||typeof r!=="object") continue;
    const c=Object.assign({},r); delete c.example;
    if(typeof c.id!=="string"||!/^[A-Za-z0-9_\-.~:@+]{1,80}$/.test(c.id)) c.id=newId();
    c.tags=Array.isArray(c.tags)?c.tags.map(String):[]; c.blocks=Array.isArray(c.blocks)?c.blocks:[];
    await saveChar(c); n++;
  }
  if(p.settings && typeof p.settings==="object") await saveSettings(Object.assign({},settings,p.settings));
  closeModal(); toast(n+"명을 가져왔어요.");
}

function loadFsImg(id, coll){

/* Firestore 문서는 1MB까지라, 그 안에 들어가도록 단계적으로 줄여요 */
async function encodeForFs(blob){
  let bmp; try{ bmp = await createImageBitmap(blob); }catch(e){ return null; }
  for(const [max,q] of [[1600,0.86],[1400,0.8],[1200,0.76],[1000,0.72],[800,0.7]]){
    const k = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1,Math.round(bmp.width*k)); cv.height = Math.max(1,Math.round(bmp.height*k));
    const ctx = cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(bmp,0,0,cv.width,cv.height);
    const d = cv.toDataURL("image/jpeg", q);
    if(d.length < 900000) return d;
  }
  return null;
}
async function fsImageFromBlob(blob, coll, prefix){
  const d = await encodeForFs(blob);
  if(!d){ toast("이미지를 읽지 못했어요. JPG나 PNG로 다시 시도해 주세요."); return null; }
  const id = newId();
  try{ await fb.fs.setDoc(fb.fs.doc(fb.db,coll||"images",id), {data:d, createdAt:Date.now()}); fsImg[id]=d; return (prefix||"fs:")+id; }
  catch(e){ fbFailed(e); return null; }
}
async function fsNormalizeRef(ref, coll, prefix){
  if(!ref || !ref.startsWith("data:")) return ref;
  const t = coll ? {coll, prefix} : imgTarget();
  try{ const b = await (await fetch(ref)).blob(); return (await fsImageFromBlob(b, t.coll, t.prefix)) || ref; }catch(e){ return ref; }
}
async function fsNormalizeChar(c){
  c = JSON.parse(JSON.stringify(c));
  if(c.cover) c.cover = await fsNormalizeRef(c.cover);
  for(const b of (c.blocks||[])){ if(Array.isArray(b.images)) for(let i=0;i<b.images.length;i++) b.images[i] = await fsNormalizeRef(b.images[i]); if(b.image) b.image = await fsNormalizeRef(b.image); }
  return c;
}
function charRefs(c){ const r=[]; if(c.cover) r.push(c.cover); (c.blocks||[]).forEach(b=>{ (b.images||[]).forEach(x=>r.push(x)); if(b.image) r.push(b.image); }); return r; }
async function fsDeleteUnused(refs, ignoreId){
  const all = [].concat(...Object.keys(KINDS).map(k=> k===kind ? chars : (store[k]||[])));
  const inUse = new Set(); all.filter(c=>c.id!==ignoreId).forEach(c=>charRefs(c).forEach(r=>inUse.add(r)));
  if(settings.banner) inUse.add(settings.banner); if(settings.avatar) inUse.add(settings.avatar);
  for(const r of refs){ const coll = r && IMG_PREFIX[r.slice(0,3)]; if(coll && !["noteImages","siteImages"].includes(coll) && !inUse.has(r)){ try{ await fb.fs.deleteDoc(fb.fs.doc(fb.db,coll,r.slice(3))); }catch(e){} } }
}
function fbFailed(e){
  const code = (e && e.code) || "";
  if(code==="permission-denied") toast("저장 권한이 없어요. 지정한 구글 계정으로 로그인했는지, Firestore 규칙을 게시했는지 확인해 주세요.");
  else if(code==="resource-exhausted") toast("오늘 무료 사용량을 다 썼어요. 내일 다시 시도해 주세요.");
  else if(code==="invalid-argument") toast("내용이 너무 커요. 글이나 이미지 수를 줄여 주세요.");
  else toast("저장에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.");
}
function renderAuth(){
  const b = $("authBtn"); if(!b) return;
  if(mode!=="firebase"){ b.hidden = true; return; }
  b.hidden = false;
  b.textContent = fbUser ? "로그아웃" : "로그인";
  b.title = fbUser ? (fbUser.email||"") : "편집하려면 로그인";
}
async function authClick(){
  if(!fb) return;
  if(fbUser){ try{ await fb.au.signOut(fb.auth); toast("로그아웃했어요"); }catch(e){} return; }
  const provider = new fb.au.GoogleAuthProvider();
  provider.setCustomParameters({prompt:"select_account"});
  try{ await fb.au.signInWithPopup(fb.auth, provider); }
  catch(e){
    const code = (e && e.code) || "";
    if(code==="auth/popup-blocked" || code==="auth/operation-not-supported-in-this-environment"){ try{ await fb.au.signInWithRedirect(fb.auth, provider); }catch(_){} }
    else if(code==="auth/unauthorized-domain") toast("Firebase › Authentication › 승인된 도메인에 tone-arc0721.github.io를 추가해 주세요.");
    else if(code!=="auth/popup-closed-by-user" && code!=="auth/cancelled-popup-request") toast("로그인하지 못했어요. 다시 시도해 주세요.");
  }
}
async function runFirebase(){
  mode = "firebase"; standalone = true; canEdit = false; localReason = "";
  renderAuth(); renderBanner(); render();
  try{
    const [A,F,U] = await Promise.all([import(FB_BASE+"firebase-app.js"), import(FB_BASE+"firebase-firestore.js"), import(FB_BASE+"firebase-auth.js")]);
    const app = A.initializeApp(FIREBASE_CONFIG);
    let db;
    try{ db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
    catch(e){ db = F.getFirestore(app); }
    fb = {db, auth:U.getAuth(app), fs:F, au:U};
  }catch(e){
    mode = "local"; renderAuth();
    localReason = "저장소에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.";
    render(); return;
  }
  const refreshOpen = ()=>{ if(openId && !draft && !editingSettings && $("ov").classList.contains("open")) viewChar(openId); };
  fb.au.onAuthStateChanged(fb.auth, u=>{
    fbUser = u;
    canEdit = !!(u && u.email && u.email.toLowerCase()===OWNER_EMAIL);
    if(u && !canEdit && !warnedNotOwner){ warnedNotOwner = true; toast("이 계정은 편집 권한이 없어요. "+OWNER_EMAIL+"로 로그인해 주세요."); }
    syncSubs(); renderAuth(); setPage(initialPage(), true); refreshOpen();
    if(canEdit) migrateSiteImages();
  });
  fb.au.getRedirectResult(fb.auth).catch(()=>{});
  subVis();
  fb.fs.onSnapshot(fb.fs.doc(fb.db,"site","settings"), snap=>{
    if(editingSettings) return;
    settings = snap.exists() ? Object.assign({}, snap.data()) : {};
    cache(); renderBanner(); render();
  }, ()=>{});
}

$("authBtn").addEventListener("click", authClick);


/* ---------- shared screen mode (same key as 발췌) ---------- */
function uiPref(){ try{ return localStorage.getItem("excerpt-ui")||"system"; }catch(e){ return "system"; } }
function syncUi(){
  document.querySelectorAll("#uiSeg [data-ui]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.ui===uiPref()));
  document.querySelectorAll("#laySeg [data-lay]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lay===window.__layout));
}
$("laySeg").addEventListener("click", e=>{ const b=e.target.closest("[data-lay]"); if(!b) return; try{ localStorage.setItem("excerpt-layout", b.dataset.lay); }catch(_){} if(window.__applyLayout) window.__applyLayout(); syncUi(); });
$("uiBtn").addEventListener("click", e=>{ e.stopPropagation(); const m=$("uiMenu"); const on=!m.classList.contains("on"); m.classList.toggle("on",on); $("uiBtn").setAttribute("aria-expanded",on); syncUi(); });
$("uiSeg").addEventListener("click", e=>{ const b=e.target.closest("[data-ui]"); if(!b) return; try{ localStorage.setItem("excerpt-ui", b.dataset.ui); }catch(_){} if(window.__applyUI) window.__applyUI(); syncUi(); });
document.addEventListener("click", e=>{ if(!e.target.closest(".uipop")){ $("uiMenu").classList.remove("on"); $("uiBtn").setAttribute("aria-expanded","false"); } });
if(window.claude){ document.documentElement.classList.add("in-claude"); $("logoLink").removeAttribute("href"); }
try{ localStorage.setItem("scrap-last","persona"); }catch(e){}

/* ---------- boot ---------- */
let localReason = "";
const cached = lsGet(LS_KEY);
if(cached){ chars = Array.isArray(cached.chars)?cached.chars:[]; settings = cached.settings||{}; }
renderBanner(); render();

/* Hosted on your own address (GitHub Pages etc.): visitors see data.json read-only; add ?edit to the address to edit in this browser. */
async function runStandalone(){
  standalone = true;
  standaloneEdit = new URLSearchParams(location.search).has("edit");
  let data = null;
  try{ const r = await fetch("data.json", {cache:"no-cache"}); if(r.ok) data = await r.json(); }catch(e){}
  const fromData = d => { chars = Array.isArray(d.chars)?d.chars:[]; settings = d.settings||{}; };
  if(standaloneEdit){
    canEdit = true;
    const newer = data && (!cached || !cached.savedAt || Date.parse(data.exportedAt||0) > cached.savedAt);
    if(newer){ fromData(data); cache(); }
    localReason = "편집 모드예요. 고친 내용은 이 브라우저에만 저장돼요. 다 고친 뒤 톱니바퀴 › 백업 내보내기 › ‘data.json 받기’로 받은 파일을 사이트에 다시 올려 주세요.";
  } else if(data){
    canEdit = false; fromData(data); localReason = "";
  } else {
    canEdit = true;
    localReason = "아직 data.json이 없어요. 주소 끝에 ?edit 를 붙여 열고 내용을 채운 뒤, 내보낸 data.json을 index.html 옆에 올리면 방문자에게 보여요.";
  }
  renderBanner(); render(); if(canEdit) checkOld();
}
async function connect(){
  if(!(window.claude && typeof window.claude.use==="function")){
    if(/^https?:$/.test(location.protocol) && !/[?&]offline\b/.test(location.search)) await runFirebase(); else await runStandalone();
    return;
  }
  window.claude.use("downloads").then(n=>{downloadsNs=n;}).catch(()=>{});
  let user=null;
  try{ [db, user, assets] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("assets")]); }catch(e){}
  if(user){
    try{ uid = await user.id(); }catch(e){}
    try{ const ce = await user.canEdit(); if(ce===false) canEdit=false; }catch(e){}
  }
  if(!db){ localReason = "지금은 이 브라우저에만 저장돼요. 로그인한 상태로 열면 계정에 저장돼요."; renderBanner(); render(); checkOld(); return; }
  let firstChars=true, firstSet=true;
  const timer=setTimeout(()=>{ if(firstChars){ localReason="저장소 응답을 기다리는 중이에요. 보이는 내용이 최신이 아닐 수 있어요."; render(); } },10000);
  db.collection("chars").onSnapshot(snap=>{
    if(snap.metadata.fromCache && firstChars) { chars = snap.docs.map(d=>Object.assign({},d.data(),{id:d.id})); render(); return; }
    if(firstChars){ firstChars=false; clearTimeout(timer); mode="cloud"; localReason=""; checkOld(); }
    chars = snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
    cache(); render();
    if(openId && !draft && !editingSettings && $("ov").classList.contains("open")) viewChar(openId);
  }, err=>{ clearTimeout(timer); mode="local"; localReason="저장소에 연결하지 못해 이 브라우저에만 저장돼요."; render(); });
  db.doc("site/settings").onSnapshot(snap=>{
    if(snap.metadata.fromCache && firstSet && !snap.exists) return;
    firstSet=false;
    if(!editingSettings){ settings = snap.exists ? Object.assign({}, snap.data()) : {}; cache(); renderBanner(); render(); }
  }, ()=>{});
  renderBanner(); render();
}
connect();
})();
</script>
