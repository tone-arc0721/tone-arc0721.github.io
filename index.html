<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* 예전 발췌 공유 링크(…/#s=…)는 발췌 화면으로 바로 넘겨요 */if(/[#&]s=/.test(location.hash))location.replace("excerpt.html"+location.search+location.hash);</script>
<script>(function(){var d=document.documentElement;function ap(){var u="system";try{u=localStorage.getItem("excerpt-ui")||"system"}catch(e){}var dk=u==="dark"||(u==="system"&&!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches));d.classList.toggle("ui-dark",dk)}window.__applyUI=ap;ap();try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",ap)}catch(e){}})();</script>
<title>스크랩</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="스크랩">
<meta name="application-name" content="스크랩">
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: the shared 스크랩 app bar, then one centered choice box with two large option cards (발췌 / 페르소나 서랍). Same tokens as the 발췌 site. */
:root{--page:#f7f7f8;--card:#ffffff;--ink:#18181b;--sub:#71717a;--faint:#a1a1aa;--line:#ececee;--line2:#e2e2e5;--soft:#f4f4f5;color-scheme:light}
html.ui-dark{--page:#0f1012;--card:#18191c;--ink:#ececf1;--sub:#a3a3ad;--faint:#6e6e78;--line:#26272c;--line2:#35363d;--soft:#232428;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.appbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
html.ui-dark .appbar{background:rgba(15,16,18,.9)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.logo{font-weight:700;font-size:16px;letter-spacing:-.4px;margin-right:auto;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--ink);display:inline-block;position:relative}
.logo i::after{content:'';position:absolute;left:5px;right:5px;top:7px;height:2px;background:var(--card);box-shadow:0 4px 0 var(--card)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
html.ui-dark .seg button[aria-pressed="true"]{background:#2d2e34;box-shadow:none}
main{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:32px 20px 64px}
.box{max-width:620px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px}
.box h1{font-size:26px;margin:0;letter-spacing:-.6px;text-wrap:balance}
.box>p{color:var(--sub);font-size:14px;margin:0 0 18px;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line2);background:var(--card);border-radius:18px;padding:26px 16px 22px;color:var(--ink);text-decoration:none;transition:border-color .12s}
.opt:hover{border-color:var(--ink)}
@media (prefers-reduced-motion: reduce){.opt{transition:none}}
.ic{width:64px;height:64px;border-radius:18px;background:var(--soft);display:grid;place-items:center;margin-bottom:6px}
.opt>span{display:flex;flex-direction:column;align-items:center;gap:4px}
.opt b{font-size:17px;letter-spacing:-.3px}
.opt small{color:var(--sub);font-size:12.5px;line-height:1.55;max-width:22em}
.tag{position:absolute;top:12px;right:12px;font-size:11px;background:var(--ink);color:var(--card);border-radius:999px;padding:2px 8px;font-weight:700}
.foot{margin-top:18px;font-size:12px;color:var(--faint)}
@media (max-width:520px){
  .opts{grid-template-columns:1fr}
  .opt{flex-direction:row;text-align:left;align-items:center;gap:14px;padding:16px}
  .ic{margin:0;width:52px;height:52px;flex:none}
  .opt>span{align-items:flex-start;gap:2px}
  .box h1{font-size:22px}
}
</style>
</head>
<body>
<div class="appbar"><div class="top-in">
  <div class="logo"><i></i><span>스크랩</span></div>
  <div class="seg" id="uiSeg" role="group" aria-label="화면 모드">
    <button type="button" data-ui="system">시스템</button><button type="button" data-ui="light">라이트</button><button type="button" data-ui="dark">다크</button>
  </div>
</div></div>
<main>
  <div class="box">
    <h1>무엇을 열까요?</h1>
    <p>채팅 로그를 발췌하거나, 캐릭터와 프롬프트를 꺼내 볼 수 있어요.</p>
    <div class="opts">
      <a class="opt" href="excerpt.html" id="go-excerpt">
        <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h11a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M19 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v3l-4-3h-3"/></svg></div>
        <span><b>채팅 발췌</b><small>로그를 붙여넣고 골라서 이미지·텍스트로 저장해요</small></span>
      </a>
      <a class="opt" href="persona/" id="go-persona">
        <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M7.5 17.5c1-2 2.6-3 4.5-3s3.5 1 4.5 3"/></svg></div>
        <span><b>페르소나 서랍</b><small>캐릭터 카드, 외형·의상 태그, 프로필을 모아 봐요</small></span>
      </a>
    </div>
    <div class="foot">화면 모드는 두 곳에 똑같이 적용돼요.</div>
  </div>
</main>
<script>
(function(){
  var last=null; try{ last=localStorage.getItem("scrap-last"); }catch(e){}
  var el = last==="persona" ? document.getElementById("go-persona") : last==="excerpt" ? document.getElementById("go-excerpt") : null;
  if(el){ var t=document.createElement("span"); t.className="tag"; t.textContent="최근"; el.appendChild(t); }
  function pref(){ try{ return localStorage.getItem("excerpt-ui")||"system"; }catch(e){ return "system"; } }
  function sync(){ document.querySelectorAll("#uiSeg [data-ui]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.ui===pref()); }); }
  document.getElementById("uiSeg").addEventListener("click", function(e){ var b=e.target.closest("[data-ui]"); if(!b) return; try{ localStorage.setItem("excerpt-ui", b.dataset.ui); }catch(_){} window.__applyUI(); sync(); });
  sync();
})();
</script>
</body>
</html>
